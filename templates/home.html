<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Fire Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Algerian Forest Fire Prediction</h2>
        <form action="{{ url_for('predict_datapoint')}}" method="POST">
            <input type="text" name="Temperature" placeholder="Temperature"><br>
            <input type="text" name="RH" placeholder="Relative Humidity"><br>
            <input type="text" name="Ws" placeholder="Wind Speed"><br>
            <input type="text" name="Rain" placeholder="Rain (mm)"><br>
            <input type="text" name="FFMC" placeholder="FFMC Index"><br>
            <input type="text" name="DMC" placeholder="DMC Index"><br>
            <input type="text" name="ISI" placeholder="ISI Index"><br>
            <input type="text" name="Classes" placeholder="Classes"><br>
            <input type="text" name="Region" placeholder="Region"><br><br>


            <button type="submit">Predict Fire Index</button>
        </form>
    </div>
</body>
</html>
